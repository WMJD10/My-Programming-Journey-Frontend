
<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
   <meta charset="UTF-8">
   
   <meta name="viewport" content="width=device-width, initial-scale=1.0">

   <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">

   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

   <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

   <link rel="stylesheet" href="css/variables.css">
   <link rel="stylesheet" href="css/global.css">
   <link rel="stylesheet" href="css/login.css">
   

</head>

<body>

  <main class="login-container">

    <div class="login-wrapper">

      <section class="login-branding">

        <div class="branding-content">

          <h1><span>Pulse</span>Fit</h1>

          <p>أهلاً بك ، يرجى تسجيل الدخول للوصول إلى كافة الخدمات.</p>

        </div>

        <div class="branding-features">

          <div class="feature-item">

            <i class="fa-solid fa-shield-halved"></i>

            <span>حماية وأمان عالي للبيانات</span>

          </div>

          <div class="feature-item">

            <i class="fa-solid fa-bolt"></i>

            <span>وصول سريع وسلس للخدمات</span>

          </div>

          <div class="feature-item">

            <i class="fa-solid fa-headset"></i>

            <span>دعم متواصل على مدار الساعة</span>

          </div>

        </div>

      </section>

      <section class="login-form">
        
        <header class="form-header">

          <h2>تسجيل الدخول</h2>

          <p>أدخل بياناتك للمتابعة</p>

        </header>

        <form action="#" method="POST">
          
          <div class="form-group">

            <label for="email">البريد الإلكتروني</label>

            <div class="input-wrapper">

              <i class="fa-regular fa-envelope"></i>

              <input type="email" id="email" name="email" placeholder="example@domain.com" required>

            </div>

          </div>

          <div class="form-group">

            <label for="password">كلمة المرور</label>

            <div class="input-wrapper">

              <i class="fa-solid fa-lock"></i>

              <input type="password" id="password" name="password" placeholder="••••••••" required>

              <button type="button" class="toggle-password" aria-label="إظهار/إخفاء كلمة المرور">

                <i class="fa-regular fa-eye"></i>

              </button>

            </div>

          </div>

          <div class="form-options">
            
            <label class="checkbox-group">

              <input type="checkbox" name="remember">

              <span>تذكرني</span>

            </label>

            <a href="#" class="forgot-link">نسيت كلمة المرور؟</a>

          </div>

          <button type="submit" class="btn-login"><a href="website.html">تسجيل الدخول</a></button>

        </form>

        <div class="form-divider">

          <span>سجل عن طريق</span>

        </div>

        <div class="alternative-login">

          <button type="button" class="btn-alternative">

            <i class="fa-brands fa-google"></i>

            <span>Google</span>

          </button>

          <button type="button" class="btn-alternative">

            <i class="fa-brands fa-apple"></i>

            <span>Appel</span>

          </button>

        </div>

        <div class="signup-section">

          <p>ليس لديك حساب؟ <a href="#" class="signup-link">أنشئ حساب جديد</a></p>

        </div>

      </section>

    </div>
  </main>

</body>
</html>
